<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فِطنة - ألغاز وكلمات إسلامية</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="mobile-frame">

    <!-- 1. شاشة تسجيل الدخول -->
    <section id="screen-auth" class="screen auth-bg">
      <div class="auth-box">
        <h2 class="auth-title">تسجيل الدخول إلى فِطنة</h2>
        <p class="auth-sub">سجّل بحسابك لمزامنة تقدمك ورصيدك</p>
        
        <input type="text" id="auth-name" class="auth-input" placeholder="اسم اللاعب" value="saleh" />
        <input type="email" id="auth-email" class="auth-input" placeholder="البريد الإلكتروني" value="mr.saleh.ay.94@gmail.com" />
        <input type="password" id="auth-pass" class="auth-input" placeholder="كلمة المرور" value="123456" />
        
        <button id="btn-login-submit" class="btn btn-primary">دخول / تسجيل حساب</button>
        <button id="btn-open-forgot" class="text-link-btn">نسيت كلمة المرور؟</button>
      </div>
    </section>

    <!-- 2. الشاشة الرئيسية -->
    <section id="screen-home" class="screen home-bg">
      <div class="top-player-bar">
        <div id="btn-open-profile" class="player-pill">👤 <span id="display-player-name">saleh</span> ⚙️</div>
        <div class="stat-badge">🪙 <span id="home-coins">150</span></div>
      </div>

      <div class="overlay-content">
        <div class="action-buttons">
          <button id="btn-continue-game" class="btn btn-primary">متابعة اللعب</button>
          <button id="btn-to-map" class="btn btn-secondary">خريطة المراحل</button>
        </div>
      </div>
    </section>

    <!-- 3. شاشة خريطة المراحل -->
    <section id="screen-map" class="screen">
      <header class="game-header">
        <button id="btn-map-back" class="nav-back">⬅</button>
        <h2>خريطة المراحل</h2>
        <div class="stat-badge">🪙 <span id="map-coins">150</span></div>
      </header>
      <div class="map-path" id="map-container"></div>
    </section>

    <!-- 4. شاشة اللعب التفاعلية -->
    <section id="screen-game" class="screen">
      <header class="game-header">
        <button id="btn-game-exit" class="nav-back">خروج</button>
        <span id="stage-title" class="stage-indicator">المرحلة 1</span>
        <div class="stat-badge">🪙 <span id="game-coins">150</span></div>
      </header>

      <div class="helpers-bar">
        <button id="hint-letter-btn" class="help-btn">💡 تلميح (20 🪙)</button>
        <button id="hint-skip-btn" class="help-btn">⏩ تخطي (50 🪙)</button>
      </div>

      <div class="question-card">
        <span id="stage-badge-type" class="type-pill">تجميع حروف</span>
        <p id="question-text">جاري تحميل السؤال...</p>
      </div>

      <!-- تجميع الحروف -->
      <div id="letters-mode-area">
        <div id="answer-boxes" class="answer-row"></div>
        <div class="letters-keyboard" id="letters-keyboard"></div>
      </div>

      <!-- الاختيار من 4 -->
      <div id="choice-mode-area" class="choices-container" style="display: none;"></div>
    </section>

    <!-- نافذة استعادة كلمة المرور -->
    <div id="forgot-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3>استعادة كلمة المرور</h3>
          <button id="btn-close-forgot" class="close-btn">✕</button>
        </div>
        <p class="store-desc">اكتب بريدك المسجل وسيرسل لك النظام كلمة سر جديدة تلقائياً:</p>
        <input type="email" id="reset-email-input" class="auth-input" placeholder="بريدك الإلكتروني" />
        <button id="btn-submit-reset" class="btn btn-primary">إرسال كلمة سر جديدة</button>
      </div>
    </div>

    <!-- نافذة الحساب -->
    <div id="profile-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3>إعدادات الحساب</h3>
          <button id="btn-close-profile" class="close-btn">✕</button>
        </div>
        <div style="text-align: right; margin-bottom: 15px;">
          <label style="font-size: 13px; color: #64748B;">تعديل كلمة المرور:</label>
          <input type="password" id="new-password-input" class="auth-input" placeholder="كلمة المرور الجديدة" />
          <button id="btn-save-new-pass" class="btn btn-secondary" style="margin-bottom: 15px;">حفظ كلمة المرور</button>
        </div>
        <button id="btn-player-logout" class="btn" style="background: #E57373; color: #FFF;">تسجيل خروج</button>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
