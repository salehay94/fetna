<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فِطنة - ألغاز وكلمات إسلامية</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="mobile-frame">

    <!-- 1. شاشة تسجيل الدخول -->
    <section id="screen-auth" class="screen auth-bg">
      <div class="auth-box">
        <h2 class="auth-title">تسجيل الدخول إلى فِطنة</h2>
        <p class="auth-sub">سجّل باسمك لمتابعة تقدمك الخاص</p>
        
        <input type="text" id="auth-name" class="auth-input" placeholder="اسم اللاعب" value="" />
        <input type="email" id="auth-email" class="auth-input" placeholder="البريد الإلكتروني" value="" />
        <input type="password" id="auth-pass" class="auth-input" placeholder="كلمة المرور" value="" />
        
        <button class="btn btn-primary" onclick="handleAuthLogin()">دخول / تسجيل حساب</button>
      </div>
    </section>

    <!-- 2. الشاشة الرئيسية -->
    <section id="screen-home" class="screen home-bg">
      <div class="top-player-bar">
        <div class="player-pill" onclick="openModal('profile-modal')">👤 <span id="display-player-name">اللاعب</span> ⚙️</div>
        <div class="stat-badge">🪙 <span id="home-coins">100</span></div>
      </div>

      <div class="overlay-content">
        <div class="action-buttons">
          <button class="btn btn-primary" onclick="continueCurrentStage()">متابعة اللعب</button>
          <button class="btn btn-secondary" onclick="showScreen('screen-map')">خريطة المراحل</button>
        </div>
      </div>
    </section>

    <!-- 3. شاشة خريطة المراحل -->
    <section id="screen-map" class="screen">
      <header class="game-header">
        <button class="nav-back" onclick="showScreen('screen-home')">⬅</button>
        <h2>خريطة المراحل</h2>
        <div class="stat-badge">🪙 <span id="map-coins">100</span></div>
      </header>
      <div class="map-path" id="map-container"></div>
    </section>

    <!-- 4. شاشة اللعب والأسئلة -->
    <section id="screen-game" class="screen">
      <header class="game-header">
        <button class="nav-back" onclick="showScreen('screen-map')">خروج</button>
        <span id="stage-title" class="stage-indicator">المرحلة 1</span>
        <div class="stat-badge">🪙 <span id="game-coins">100</span></div>
      </header>

      <div class="helpers-bar">
        <button id="hint-letter-btn" class="help-btn" onclick="useHintRevealLetter()">💡 تلميح (20 🪙)</button>
        <button class="help-btn" onclick="useHintSkipStage()">⏩ تخطي (50 🪙)</button>
      </div>

      <div class="question-card">
        <span id="stage-badge-type" class="type-pill">تجميع حروف</span>
        <p id="question-text">جاري تحميل السؤال...</p>
      </div>

      <!-- واجهة تجميع الحروف والكلمات المتقاطعة -->
      <div id="letters-mode-area">
        <div id="answer-boxes" class="answer-row"></div>
        <div class="letters-keyboard" id="letters-keyboard"></div>
      </div>

      <!-- واجهة 4 خيارات -->
      <div id="choice-mode-area" class="choices-container" style="display: none;"></div>

      <!-- نافذة إشعار النتيجة الاحترافية المدمجة -->
      <div id="result-modal" class="result-modal-overlay">
        <div class="result-card" id="result-card-box">
          <div class="result-icon" id="result-icon">🎉</div>
          <h3 id="result-title">ما شاء الله!</h3>
          <p id="result-desc">+15 نقطة تمت إضافتها لرصيدك</p>
          
          <div class="result-actions">
            <button id="result-btn" class="btn btn-primary" onclick="handleResultDismiss()">المرحلة التالية</button>
            <button id="result-home-btn" class="btn btn-secondary" onclick="handleResultGoHome()">الرئيسية 🏠</button>
          </div>
        </div>
      </div>
    </section>

    <!-- نافذة إعدادات الحساب -->
    <div id="profile-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3>إعدادات الحساب</h3>
          <button class="close-btn" onclick="closeModal('profile-modal')">✕</button>
        </div>
        <p class="store-desc">اللاعب: <strong id="modal-player-name">اللاعب</strong></p>
        <p class="store-desc">البريد: <strong id="modal-player-email">-</strong></p>
        <button class="btn" style="background: #E57373; color: #FFF; margin-bottom: 10px;" onclick="logoutPlayer()">تسجيل خروج</button>
        <button class="btn btn-secondary" onclick="closeModal('profile-modal')">إغلاق</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script src="stages_data.js"></script>
  <script src="map.js"></script>
  <script src="quiz.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      checkExistingUser();
      loadStages();
    });
  </script>
</body>
</html>
